<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ledggit</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500&family=Work+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--card:#fbf9f4;--ink:#1d1b17;--mute:#8a8376;--line:#e3ddd0;--acc:#9a6b2f;--win:#2f7d5b;--loss:#b4493a;--wint:rgba(47,125,91,.16);--lost:rgba(180,73,58,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f11;--card:#16181b;--ink:#ece6da;--mute:#8b877e;--line:#25282c;--acc:#d2a96a;--win:#6fc19a;--loss:#e17f6e;--wint:rgba(111,193,154,.16);--lost:rgba(225,127,110,.15)}}
:root[data-theme="dark"]{--bg:#0e0f11;--card:#16181b;--ink:#ece6da;--mute:#8b877e;--line:#25282c;--acc:#d2a96a;--win:#6fc19a;--loss:#e17f6e;--wint:rgba(111,193,154,.16);--lost:rgba(225,127,110,.15)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif;min-height:100vh}
.serif{font-family:Fraunces,Georgia,serif;font-weight:300}
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-content:center;text-align:center;z-index:99;transition:opacity .8s}
#splash h1{font:300 clamp(44px,13vw,84px)/1 Fraunces,Georgia,serif;margin:0;letter-spacing:.02em}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);animation:in 1s forwards}
#splash p{color:var(--acc);letter-spacing:.4em;text-transform:uppercase;font-size:11px;opacity:0;animation:in 1s 1.2s forwards}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:26px}.logo i{color:var(--acc);font-style:normal}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);padding:6px 14px;border-radius:99px;font:500 13px Manrope;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.hero{margin:6px 0 20px}.hero small{color:var(--mute);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.hero .eq{font-size:46px;line-height:1.1;margin:2px 0}
.row{display:flex;gap:22px;color:var(--mute);font-size:13px;flex-wrap:wrap}.row b{color:var(--ink);font-weight:500}
.pos{color:var(--win)}.neg{color:var(--loss)}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;display:flex;gap:2px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.15)}
nav button{border:0;background:none;color:var(--mute);padding:9px 18px;border-radius:99px;font:500 13px Manrope;cursor:pointer}nav button.on{background:var(--acc);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h2{margin:0;font-size:22px}
.ic{border:1px solid var(--line);background:none;color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{color:var(--mute);font-size:11px;text-align:center;padding-bottom:4px}
.d{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:none;color:var(--ink);font:500 13px Manrope;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.d small{font-size:9px;font-weight:500}.d.w{background:var(--wint)}.d.l{background:var(--lost)}.d.t{border-color:var(--acc)}.d:hover{border-color:var(--line)}
.tr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.tr:last-child{border:0}.tr small{color:var(--mute)}
.btn{border:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font:600 14px Manrope;cursor:pointer;width:100%}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
#sh h3{margin:0 0 4px;font-size:26px}label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font:400 15px Manrope;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shot{width:100%;border-radius:14px;margin-top:8px;border:1px solid var(--line)}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.ai{white-space:pre-wrap;font-size:14.5px;line-height:1.65}.mute{color:var(--mute);font-size:13px}.hide{display:none}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:12px}.live i{width:8px;height:8px;border-radius:50%;background:var(--win);animation:pl 1.6s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 var(--win)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);padding:8px 16px;border-radius:99px;font:500 13px Manrope;cursor:pointer;white-space:nowrap;transition:.3s}.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc);transform:translateY(-1px)}
.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.meter{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--loss),var(--line) 50%,var(--win));margin:18px 0 6px}.meter b{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);left:50%;transform:translateX(-50%);transition:left 1.4s cubic-bezier(.2,.9,.2,1)}
.ml{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.pt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.pt:last-child{border:0}.pt .e{font-size:22px;line-height:1.2}.pt b{font-weight:600;display:block}.pt span{color:var(--mute);font-size:14px}
.hl{font-size:26px;line-height:1.2;margin:0 0 8px}.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.pl2{border-left:2px solid var(--acc);padding:2px 0 2px 14px;margin:10px 0}.src a{color:var(--mute);font-size:12px;margin-right:12px;text-decoration:underline}
:root{--g1:rgba(154,107,47,.17);--g2:rgba(47,125,91,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(210,169,106,.13);--g2:rgba(111,193,154,.07)}}
:root[data-theme="dark"]{--g1:rgba(210,169,106,.13);--g2:rgba(111,193,154,.07)}
body,#splash{background:radial-gradient(900px 520px at 6% -8%,var(--g1),transparent 70%),radial-gradient(800px 560px at 104% 2%,var(--g2),transparent 70%),var(--bg);background-attachment:fixed}
:root[data-style] *{font-family:var(--fb)!important}
:root[data-style] .serif,:root[data-style] .serif *,:root[data-style] #splash h1,:root[data-style] #splash h1 span{font-family:var(--fd)!important}
:root[data-style="sage"]{--fd:'Playfair Display',Georgia,serif;--fb:'Work Sans',system-ui,sans-serif;--bg:#eef1ea;--card:#f8faf4;--ink:#1c2a22;--mute:#77857b;--line:#dbe2d4;--acc:#4a6b4f;--win:#3f8f5f;--loss:#b5533c;--wint:rgba(63,143,95,.16);--lost:rgba(181,83,60,.13);--g1:rgba(74,107,79,.17);--g2:rgba(214,190,140,.22)}
:root[data-style="plum"]{--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Figtree',system-ui,sans-serif;--bg:#1a1320;--card:#231a2b;--ink:#f3e9f0;--mute:#9c8ba6;--line:#34283f;--acc:#f0a6c0;--win:#7fd1ae;--loss:#ff8a8a;--wint:rgba(127,209,174,.15);--lost:rgba(255,138,138,.15);--g1:rgba(240,166,192,.16);--g2:rgba(124,92,255,.15)}
:root[data-style="mono"]{--fd:'JetBrains Mono',ui-monospace,monospace;--fb:'JetBrains Mono',ui-monospace,monospace;--bg:#0a0a0a;--card:#131313;--ink:#e6e6e6;--mute:#808080;--line:#242424;--acc:#c6ff3d;--win:#c6ff3d;--loss:#ff6b5b;--wint:rgba(198,255,61,.12);--lost:rgba(255,107,91,.14);--g1:rgba(198,255,61,.09);--g2:rgba(198,255,61,.03)}
:root[data-style="original"]{--fd:'Fraunces',Georgia,serif;--fb:'Manrope',system-ui,sans-serif}
:root[data-style="original"] body,:root[data-style="original"] #splash{background:var(--bg)}
nav button{padding:10px 20px}nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;pointer-events:none}
.eqrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.eqbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}.eqbox small{display:block;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:10px;margin-bottom:6px}.ei{display:flex;gap:6px}.ei select{width:auto;padding:8px 4px;font-size:13px}.ei input{flex:1;min-width:0;padding:8px 10px;font-size:16px}.eqbox .eq{font-size:26px;line-height:1.4;margin:0;overflow-wrap:anywhere}
.plr{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px}.plr span{color:var(--mute);font-size:13px}.plr b{font-size:18px;font-weight:600}.plr.pos{background:var(--wint)}.plr.pos b{color:var(--win)}.plr.neg{background:var(--lost)}.plr.neg b{color:var(--loss)}
.plr{flex-direction:column;justify-content:center;gap:2px;text-align:center}.plr b{font-size:24px}
</style></head><body>
<div id="splash"><h1 id="sp"></h1><p>trade book</p></div>
<div class="wrap"><header><div class="logo serif">ledggit<i>.</i></div><div style="display:flex;gap:10px;align-items:center"><div class="seg" id="mode"><button data-m="j" class="on">Journal</button><button data-m="b">Backtest</button></div><button class="ic" id="sty" title="Style">Aa</button><button class="ic" id="bak" title="Backup" aria-label="Backup"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 19h14"/></svg></button></div></header>
<div id="app"></div></div>
<nav id="nav"><button data-t="cal" class="on" aria-label="Calendar" title="Calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button><button data-t="ins" aria-label="Insights" title="Insights"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg></button><button data-t="brief" aria-label="News brief" title="News brief"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9h5M7.5 12.5h9M7.5 16h9"/></svg></button><button data-t="calc" aria-label="Position calculator" title="Position calculator"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M8.5 7.5h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg></button></nav>
<div id="ov"><div id="sh"></div></div>
<script>
const SYMS=["XAUUSD","XAGUSD","EURUSD","GBPUSD","USDJPY","GBPJPY","AUDUSD","USDCAD","USOIL","NAS100","US30","BTCUSD","NIFTY","BANKNIFTY","SENSEX"];
const EMO=["Calm","Confident","Hesitant","FOMO","Revenge","Fearful","Bored"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={eq:{j:10000,b:10000},tr:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem("ledggit")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ledggit",JSON.stringify(S))}catch(e){toast("Storage is full — remove some screenshots.")}};
let M="j",T="cal",cur=new Date();cur.setDate(1);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
S.cc=S.cc||{j:"USD",b:"USD"};
const CURS={USD:["$","US Dollar"],EUR:["€","Euro"],GBP:["£","British Pound"],INR:["₹","Indian Rupee"],JPY:["¥","Japanese Yen"],AUD:["A$","Australian Dollar"],CAD:["C$","Canadian Dollar"],CHF:["CHF ","Swiss Franc"],AED:["AED ","UAE Dirham"],SGD:["S$","Singapore Dollar"]};
const fm=n=>(n<0?"−":"")+((CURS[S.cc[M]]||CURS.USD)[0])+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
const mine=()=>S.tr.filter(t=>t.m===M);
const pc=n=>n>=0?"pos":"neg";
// splash
"ledggit".split("").forEach((c,i)=>{const s=document.createElement("span");s.textContent=c;s.style.animationDelay=(i*.12)+"s";$("#sp").appendChild(s)});
setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").remove(),800)},2900);
function stats(a){const w=a.filter(t=>t.pnl>0),l=a.filter(t=>t.pnl<0),net=a.reduce((x,t)=>x+t.pnl,0);return{n:a.length,net,wr:a.length?Math.round(w.length/a.length*100):0,aw:w.length?w.reduce((x,t)=>x+t.pnl,0)/w.length:0,al:l.length?l.reduce((x,t)=>x+t.pnl,0)/l.length:0}}
function render(){const a=mine(),s=stats(a),ym=k0(cur.getFullYear(),cur.getMonth()),ms=stats(a.filter(t=>t.d.startsWith(ym))),se=openBal(ym),pcg=se?ms.net/se*100:0,cm=T=="cal",nw=new Date(),late=cur>=new Date(nw.getFullYear(),nw.getMonth(),1);
let h=`<div class="hero"><div class="eqrow"><div class="eqbox"><small>Starting equity</small><div class="eq serif" id="seq" style="cursor:pointer;display:flex;align-items:center;gap:8px">${fm(se)}<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--mute)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></div></div><div class="eqbox"><small>${late?"Current equity":"Equity · month end"}</small><div class="eq serif" id="eqb">${fm(se+ms.net)}</div></div></div>${cm?`<div class="plr ${ms.net>0?"pos":ms.net<0?"neg":""}"><span>Profit / loss</span><b>${ms.net>0?"+":""}${fm(ms.net)} (${pcg>=0?"+":""}${pcg.toFixed(2)}%)</b></div>`:""}<div class="row">${cm?`<span>Trades <b>${ms.n}</b></span><span>Win rate <b>${ms.n?ms.wr+"%":"—"}</b></span>`:`<span>Net <b class="${pc(s.net)}">${fm(s.net)}</b></span><span>Win rate <b>${s.wr}%</b></span><span>Trades <b>${s.n}</b></span><span>Start <b>${fm(S.eq[M])}</b></span>`}</div></div>`;
if(T=="cal")h+=cal();else if(T=="ins")h+=ins(s);else if(T=="calc")h+=calc();else h+=brief();
$("#app").innerHTML=h;wire()}
function cal(){const y=cur.getFullYear(),mo=cur.getMonth(),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),by={};mine().forEach(t=>by[t.d]=(by[t.d]||0)+t.pnl);
let g=["S","M","T","W","T","F","S"].map(x=>`<div class="dow">${x}</div>`).join("")+"<div></div>".repeat(first);
for(let i=1;i<=dim;i++){const k=key(new Date(y,mo,i)),v=by[k];g+=`<button class="d ${v>0?"w":v<0?"l":""} ${k==key(new Date())?"t":""}" data-d="${k}">${i}${v!=null?`<small class="${pc(v)}">${v>0?"+":""}${Math.round(v)}</small>`:""}</button>`}
const mt=mine().filter(t=>t.d.startsWith(k0(y,mo))).reduce((x,t)=>x+t.pnl,0);
return `<div class="card"><div class="mh"><button class="ic" id="pv">‹</button><h2 class="serif">${cur.toLocaleString("en",{month:"long",year:"numeric"})}</h2><button class="ic" id="nx">›</button></div><div class="grid">${g}</div></div>`}
const k0=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
function ins(s){const a=mine();if(!a.length)return `<div class="card mute">Log a few trades and your patterns will appear here.</div>`;
const grp=f=>{const o={};a.forEach(t=>{const k=f(t)||"—";(o[k]=o[k]||[]).push(t)});return Object.entries(o).map(([k,v])=>({k,...stats(v)})).sort((x,y)=>y.net-x.net)};
const tb=(t,r)=>{const mx=Math.max(...r.map(x=>Math.abs(x.net)),1);return `<div class="card"><div class="mh"><h2 class="serif">${t}</h2></div>${r.map(x=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${esc(x.k)} <span class="mute">· ${x.n} · ${x.wr}%</span></span><b class="${pc(x.net)}">${fm(x.net)}</b></div><div class="bar"><i style="width:${Math.abs(x.net)/mx*100}%;background:var(--${x.net>=0?"win":"loss"})"></i></div></div>`).join("")}</div>`};
return `<div class="card"><div class="two"><div><div class="mute">Avg win</div><div class="serif pos" style="font-size:28px">${fm(s.aw)}</div></div><div><div class="mute">Avg loss</div><div class="serif neg" style="font-size:28px">${fm(s.al)}</div></div></div></div>`+tb("By instrument",grp(t=>t.sym))+tb("By state of mind",grp(t=>t.emo))+`<div class="card"><div class="mh"><h2 class="serif">Coach</h2></div><div id="aiO" class="ai mute">Claude reads your trades, remarks and emotions and reflects on your behaviour.</div><br><button class="btn" id="aiB">Reflect on my trading</button></div>`}
function brief(){return `<div class="card"><div class="mh"><h2 class="serif">Market brief</h2></div><label>Instrument</label><select id="bs">${SYMS.map(x=>`<option>${x}</option>`).join("")}</select><br><br><button class="btn" id="bb">Prepare my day</button><p class="mute">Claude summarises the themes and scheduled events that tend to move this instrument and how they may bias it. It does not read live feeds — confirm exact times and figures on Forex Factory before trading.</p><div id="bo" class="ai"></div></div>`}
function wire(){document.querySelectorAll(".d").forEach(b=>b.onclick=()=>day(b.dataset.d));
const p=$("#pv"),n=$("#nx");if(p){p.onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};n.onclick=()=>{cur.setMonth(cur.getMonth()+1);render()}}
$("#eqb").onclick=()=>{open(`<h3 class="serif">Starting equity</h3><div class="mute">${M=="j"?"Journal":"Backtest"} account</div><label>Currency</label><select id="f_cc">${Object.keys(CURS).map(k=>`<option value="${k}" ${k==(S.cc[M]||"USD")?"selected":""}>${CURS[k][0].trim()} · ${k} · ${CURS[k][1]}</option>`).join("")}</select><label>Amount</label><input id="f_eq" type="number" step="any" inputmode="decimal" value="${S.eq[M]}"><br><br><button class="btn" id="eqs">Save</button>`);$("#eqs").onclick=()=>{const v=$("#f_eq").value;if(v===""||isNaN(+v)){toast("Enter a number.");return}S.eq[M]=+v;S.cc[M]=$("#f_cc").value;save();close();render()}};
const ab=$("#aiB");if(ab)ab.onclick=ai;const bb=$("#bb");if(bb)bb.onclick=news}
const toast=m=>{const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:200;font-size:13px";document.body.appendChild(t);setTimeout(()=>t.remove(),2500)};
const open=h=>{$("#sh").innerHTML=h;$("#ov").style.display="flex"},close=()=>$("#ov").style.display="none";

open(`<h3 class="serif">Starting equity</h3><div class="mute">${mn} · ${M=="j"?"Journal":"Backtest"}. Enter a figure to override the previous month’s closing balance.</div><label>Currency</label><select id="f_cc">${Object.keys(CURS).map(k=>`<option value="${k}" ${k==(S.cc[M]||"USD")?"selected":""}>${CURS[k][0].trim()} · ${k} · ${CURS[k][1]}</option>`).join("")}</select><label>Amount</label><input id="f_eq" type="number" step="any" inputmode="decimal" value="${openBal(ym)}"><br><br><button class="btn" id="eqs">Save</button>${has?`<br><br><button class="btn g" id="eqr">Use previous month’s closing balance</button>`:""}`);
$("#eqs").onclick=()=>{const v=$("#f_eq").value;if(v===""||isNaN(+v)){toast("Enter a number.");return}const earlier=Object.keys(ov).concat(mine().map(t=>t.d.slice(0,7))).filter(m=>m<ym);ov[ym]=+v;if(!earlier.length)S.eq[M]=+v;S.cc[M]=$("#f_cc").value;save();close();render()};
if(has)$("#eqr").onclick=()=>{delete ov[ym];save();close();render()}}
$("#bak").onclick=()=>{open(`<h3 class="serif">Backup</h3><div class="mute">Your trades live only in this browser. Save a copy now and then.</div><br><button class="btn" id="bx">Download backup file</button><div class="mute" id="bm" style="margin:8px 0"></div><label>Or copy the backup text</label><textarea id="bt" rows="3" readonly></textarea><br><br><label>Restore</label><input id="bf" type="file" accept=".json,application/json"><textarea id="bp" rows="3" placeholder="…or paste backup text here" style="margin-top:8px"></textarea><br><br><button class="btn g" id="bi">Restore from backup</button>`);
const data=()=>JSON.stringify({app:"ledggit",v:1,at:new Date().toISOString(),data:S});
$("#bt").value=data();$("#bt").onclick=e=>e.target.select();
$("#bx").onclick=()=>{try{const b=new Blob([data()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ledggit-backup-"+key(new Date())+".json";document.body.appendChild(a);a.click();a.remove();$("#bm").textContent="Backup file created. Check your downloads. If nothing downloads, copy the text below instead."}catch(e){$("#bm").textContent="Downloads aren’t available here. Copy the backup text below instead."}};
$("#bf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#bp").value=r.result};r.readAsText(f)};
let arm=0;$("#bi").onclick=()=>{try{const j=JSON.parse($("#bp").value),d=j.data||j;if(!d||!Array.isArray(d.tr))throw 0;if(!arm){arm=1;$("#bi").textContent="Tap again to replace everything with this backup";return}S.tr=d.tr;S.eq=d.eq||S.eq;S.cc=d.cc||S.cc;S.ov=d.ov||{j:{},b:{}};save();close();render();toast("Backup restored")}catch(e){arm=0;$("#bm").textContent="That doesn’t look like a ledggit backup."}}};
render();
</script></body></html>
